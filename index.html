<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">

            <!-- Left: brand, seed, current difficulty -->
            <div class="brand-group">
                <h1>CODEX</h1>
                <div class="brand-meta">
                    <span id="game-seed-display"></span>
                    <span class="brand-meta-sep">·</span>
                    <span id="game-difficulty-display"></span>
                </div>
            </div>

            <!-- Centre: solve progress -->
            <div class="status-group">
                <div class="progress-wrapper">
                    <span>ANALYSIS:</span>
                    <span id="game-progress"></span>
                    <div class="progress-track">
                        <div id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Right: hint, external link, menu -->
            <div class="header-actions">
                <a href="https://github.com/Ed-von-Schleck/codex" class="github-link"
                   target="_blank" rel="noopener">GITHUB SOURCE</a>
                <button id="hint-button" aria-label="Get a hint">HINT</button>
                <button id="menu-button" aria-label="Menu">MENU</button>
            </div>

        </div>
    </header>

    <main class="game-container">
        <!-- Section 1: Palette & Rule Construction -->
        <section class="workspace">
            <div class="sticky-palette-container">
                <div id="symbol-palette" class="palette"></div>
            </div>
            <div id="rules-list" class="rules-grid"></div>
        </section>

        <!-- Section 2: Verification -->
        <section class="sidebar">
            <div class="sidebar-header">
                <h2>Target Strings</h2>
                <p class="instruction">Reconstruct the sequence logic to match all examples.</p>
            </div>
            <ul id="examples-list" class="examples-list"></ul>
        </section>
    </main>

    <!-- Unified overlay, shared by MENU and WIN states — see showOverlay() in ui.js -->
    <div id="workspace-overlay" class="overlay hidden">
        <div class="overlay-card">

            <h2 id="overlay-title">SYSTEM MENU</h2>

            <!-- Shown only on wins that used hints -->
            <p id="overlay-subtitle" class="overlay-subtitle" style="display:none"></p>

            <div class="difficulty-selector">
                <p class="difficulty-label">DIFFICULTY</p>
                <!-- Buttons are generated from DIFFICULTIES in difficulty.js -->
                <div class="difficulty-buttons"></div>
            </div>

            <div class="overlay-actions">
                <button id="overlay-new-game-button" class="btn-primary">INITIATE NEW SEQUENCE</button>
                <button id="overlay-share-button"    class="btn-share">COPY CHALLENGE LINK</button>
                <!-- Hidden after a win (nothing to resume) -->
                <button id="overlay-resume-button">RESUME ANALYSIS</button>
            </div>

        </div>
    </div>

    <script src="js/seedrandom.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
